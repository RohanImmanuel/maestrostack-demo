# Regression: open an article from search results and scroll through its content.
appId: org.wikipedia.alpha
---
- launchApp:
    clearState: true
# Clear both first-run screens: 3x "Forward" (onboarding) then "Skip"
# (personalization). See smoke/onboarding.yml for details.
- tapOn: "Forward"
- tapOn: "Forward"
- tapOn: "Forward"
- tapOn: "Skip"
- tapOn:
    text: "Allow|While using the app|Don.t allow"
    optional: true
# Feed search bar (top) reads "Search"; index 0 avoids the bottom "Search" nav tab.
# Tap twice: the first tap surfaces a one-time "tap to search" coachmark that
# blocks input; the second dismisses it and focuses the search field.
- tapOn:
    text: "Search"
    index: 0
- tapOn:
    text: "Search"
    index: 0
- inputText: "Albert Einstein"
- assertVisible:
    text: "Albert Einstein"
- tapOn:
    text: "Albert Einstein"
    index: 0
- assertVisible:
    text: "Albert Einstein"
- scroll
- scroll
