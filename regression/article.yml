# Regression: open an article from search results and scroll through its content.
appId: org.wikipedia.alpha
---
- launchApp:
    clearState: true
- tapOn: "Forward"
- tapOn: "Forward"
- tapOn: "Forward"
- tapOn: "Skip"
- tapOn:
    text: "Allow|While using the app|Don.t allow"
    optional: true
- tapOn: "Search"
- tapOn: "Search"
- tapOn:
    text: "Search Wikipedia"
    index: 1
- inputText: "Albert Einstein"
- assertVisible:
    text: "Albert Einstein"
- tapOn:
    text: "Albert Einstein"
    index: 1
- tapOn: 
    text: "Close"
    optional: true
- tapOn: 
    text: "Close"
    optional: true
- assertVisible:
    text: "Albert Einstein"

