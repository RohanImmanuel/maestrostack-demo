# Smoke: clear the first-run onboarding and land on the search screen.
#
# On a fresh install Wikipedia opens a 3-screen onboarding (Intro > Data privacy >
# Languages). There is no "Skip" button (see InitialOnboardingScreen.kt upstream) —
# you advance with the "Forward" arrow, and the arrow on the last screen finishes it.
appId: org.wikipedia.alpha
---
- launchApp:
    clearState: true
- tapOn: "Forward"   # Intro -> Data privacy
- tapOn: "Forward"   # Data privacy -> Languages
- tapOn: "Forward"   # Languages -> finish onboarding
# Android 13 may now ask for notification permission — dismiss it if it shows.
- tapOn:
    text: "Allow|While using the app|Don.t allow"
    optional: true
- assertVisible:
    text: "Search Wikipedia"
