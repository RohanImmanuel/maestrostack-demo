# Smoke: search for a term and confirm a matching result is shown.
appId: org.wikipedia.alpha
---
- launchApp:
    clearState: true
# Clear the 3-screen onboarding via the "Forward" arrow (see onboarding.yml).
- tapOn: "Forward"
- tapOn: "Forward"
- tapOn: "Forward"
- tapOn:
    text: "Allow|While using the app|Don.t allow"
    optional: true
- tapOn:
    text: "Search Wikipedia"
- inputText: "Maestro"
- assertVisible:
    text: "Maestro.*"
