# Smoke: search for a term and confirm a matching result is shown.
appId: org.wikipedia.alpha
---
- launchApp:
    clearState: true
- tapOn: "Forward"
- tapOn: "Forward"
- tapOn: "Forward"
- tapOn: "Skip"
- tapOn:
    text: "Allow|While using the app|Don.t allow"
    optional: true
- tapOn: "Search"
- tapOn: "Search"
- tapOn:
    text: "Search Wikipedia"
    index: 1
- inputText: "Maestro"
- assertVisible:
    text: "Maestro.*"
